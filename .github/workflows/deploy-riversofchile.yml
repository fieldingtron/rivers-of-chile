name: Deploy riversofchile.pages.dev

on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'

concurrency:
  group: deploy-riversofchile
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      deployments: read
    outputs:
      pending: ${{ steps.queue.outputs.pending }}
      edit: ${{ steps.queue.outputs.edit }}
    steps:
      - name: Compare queued changes with the published batch
        id: queue
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const [releases, edits, manual] = await Promise.all([
              github.rest.repos.listDeployments({
                ...repo, environment: 'chile-beta-checkpoint', per_page: 1
              }),
              github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'queue-riversofchile.yml', per_page: 1
              }),
              github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'deploy-riversofchile.yml', event: 'workflow_dispatch', per_page: 1
              })
            ]);
            const release = releases.data[0];
            const edit = [edits, manual].map(result => result.data.workflow_runs[0]?.id || 0).join('/');
            const saved = typeof release?.payload === 'string' ? JSON.parse(release.payload) : release?.payload;
            core.setOutput('edit', edit);
            core.setOutput('pending', !release || release.sha !== context.sha ||
              saved?.edit !== edit);

  deploy:
    needs: check
    if: needs.check.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build from live Directus
        run: pnpm build && pnpm check
        env:
          RIVER_PRODUCTION: ${{ vars.RIVER_PRODUCTION }}
          DIRECTUS_URL: https://content.fieldsmarshall.com
          DIRECTUS_BUILD_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}

      - name: Configure private form delivery
        run: printf '%s' "$DIRECTUS_FORM_TOKEN" | pnpm exec wrangler pages secret put DIRECTUS_FORM_TOKEN --project-name=riversofchile
        env:
          DIRECTUS_FORM_TOKEN: ${{ secrets.DIRECTUS_FORM_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply indexing settings to the image server
        if: contains(fromJSON('["0","1"]'), format('{0}', vars.RIVER_PRODUCTION))
        working-directory: image-origin
        run: |
          printf '\n[vars]\nRIVER_PRODUCTION = "%s"\n' "$RIVER_PRODUCTION" >> wrangler.toml
          ../node_modules/.bin/wrangler pages deploy public --project-name=riversofchile-images --branch=main --commit-dirty=true
        env:
          RIVER_PRODUCTION: ${{ vars.RIVER_PRODUCTION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=riversofchile --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the batch that reached the beta
        uses: actions/github-script@v8
        env:
          EDIT: ${{ needs.check.outputs.edit }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo, ref: context.sha, environment: 'chile-beta-checkpoint',
              auto_merge: false, required_contexts: [], production_environment: false,
              payload: { edit: process.env.EDIT }, description: 'Published Chile beta batch'
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: data.id, state: 'success',
              environment_url: 'https://riversofchile.pages.dev'
            });

name: Deploy riversofchile.pages.dev

on:
  workflow_dispatch:
  repository_dispatch:
    types: [directus-rebuild]
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'image-origin/**'
      - '.github/**'

# A burst of Directus edits cancels the in-flight wait and starts a new 60s
# debounce, so only the last event in a batch deploys.
concurrency:
  group: deploy-riversofchile
  cancel-in-progress: true

jobs:
  debounce:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Directus edits to settle
        run: sleep 60

  deploy:
    needs: [debounce]
    if: always() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build from live Directus
        run: pnpm build && pnpm check
        env:
          DIRECTUS_URL: https://content.fieldsmarshall.com
          DIRECTUS_BUILD_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}

      - name: Configure private form delivery
        run: printf '%s' "$DIRECTUS_FORM_TOKEN" | pnpm exec wrangler pages secret put DIRECTUS_FORM_TOKEN --project-name=riversofchile
        env:
          DIRECTUS_FORM_TOKEN: ${{ secrets.DIRECTUS_FORM_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=riversofchile --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
